name: Android Release (Play Internal)

# Builds a signed Android App Bundle and uploads it to the Google Play
# "internal" testing track. Mirrors the iOS Xcode Cloud flow:
#   - Flutter version is pinned (must match ios/ci_scripts/ci_post_clone.sh)
#   - The build number / versionCode is derived from the CI run number so it
#     always increases and never collides with existing Play releases.
#
# Required GitHub repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64      base64 of upload-keystore.jks  (`base64 -i upload-keystore.jks | pbcopy`)
#   ANDROID_KEYSTORE_PASSWORD    keystore storePassword
#   ANDROID_KEY_ALIAS            key alias (this app uses: upload)
#   ANDROID_KEY_PASSWORD         key password
#   PLAY_SERVICE_ACCOUNT_JSON    full JSON of a Play Console service account with release access

on:
  push:
    branches: [develop]
    paths:
      - 'app/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch: {}   # allow manual runs from the Actions tab

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.6'        # keep in sync with ios/ci_scripts/ci_post_clone.sh
  JAVA_VERSION: '17'
  # versionCode = VERSION_CODE_OFFSET + github.run_number.
  # Set the offset so the FIRST CI build exceeds the highest versionCode already
  # live on Play. (e.g. if Play's max versionCode is 9, an offset of 100 makes the
  # first run produce 101.) TODO: confirm against Play Console before first run.
  VERSION_CODE_OFFSET: '100'

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Compute versionCode
        id: vc
        run: echo "code=$(( ${{ env.VERSION_CODE_OFFSET }} + ${{ github.run_number }} ))" >> "$GITHUB_OUTPUT"

      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/keystore
          echo "$KEYSTORE_B64" | base64 --decode > android/keystore/upload-keystore.jks
          # Fail fast if the secret was empty/misconfigured.
          test -s android/keystore/upload-keystore.jks

      - name: Write key.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storeFile=../keystore/upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Build App Bundle
        run: >
          flutter build appbundle --release
          --build-number=${{ steps.vc.outputs.code }}

      - name: Upload to Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: company.thecloud.pantry
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Clean up secrets on runner
        if: always()
        run: rm -f android/keystore/upload-keystore.jks android/key.properties
